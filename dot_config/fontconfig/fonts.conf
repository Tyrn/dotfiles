<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
    <!-- 1. System-wide rule: If a generic 'monospace' is asked, prioritize FiraCode then Noto -->
    <alias>
        <family>monospace</family>
        <prefer>
            <family>FiraCode Nerd Font</family>
            <family>Noto Color Emoji</family>
        </prefer>
    </alias>

    <!-- 2. Target the specific FiraCode pattern safely -->
    <match target="pattern">
        <test name="family" qual="any">
            <string>FiraCode Nerd Font</string>
        </test>
        <!-- Use 'append' so FiraCode handles text, but 'strong' so Noto overrides monochrome fallbacks -->
        <edit name="family" mode="append" binding="strong">
            <string>Noto Color Emoji</string>
        </edit>
    </match>
</fontconfig>
