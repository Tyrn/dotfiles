# theme = "3024.dark"

[colors]
# author = "Chris Kempson"
# name = "3024 (dark)"

[colors.bright]
black = "#5c5855"
blue = "#01a0e4"
cyan = "#b5e4f4"
green = "#01a252"
magenta = "#a16a94"
red = "#db2d20"
white = "#f7f7f7"
yellow = "#fded02"

[colors.cursor]
cursor = "#a5a2a2"
text = "#090300"

[colors.normal]
black = "#090300"
blue = "#01a0e4"
cyan = "#b5e4f4"
green = "#01a252"
magenta = "#a16a94"
red = "#db2d20"
white = "#a5a2a2"
yellow = "#fded02"

[colors.primary]
background = "#151515"
foreground = "#a5a2a2"

[font]
size = 10.0

# TerminalFont is defined in ~/.config/fontconfig/fonts.conf
# check:
#   which fc-test
# if available:
#   fc-test TerminalFont
# or
#   fc-test
[font.normal]
family = "TerminalFont"
style = "Regular"

[font.bold]
family = "TerminalFont"
style = "Bold"

[font.italic]
family = "TerminalFont"
style = "Italic"

[font.bold_italic]
family = "TerminalFont"
style = "Bold Italic"

[window]
opacity = 0.9

[cursor]
# Settings for your regular cursor
#style = { shape = "Beam", blinking = "On" }

# Settings for active Vi mode
vi_mode_style = { shape = "Block", blinking = "Never" }
